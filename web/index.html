<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>KrinkerLabs Pinball</title>
<style>
  :root { --amber:#ffb84a; --ink:#05070f; --glass:rgba(10,16,34,.62); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--ink); color:#fff; font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud { position:fixed; inset:0; pointer-events:none; }
  .panel { position:absolute; top:max(12px,env(safe-area-inset-top)); left:12px; padding:10px 16px 12px; border-radius:14px; background:var(--glass); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.12); min-width:190px; }
  .panel small { display:block; font-size:11px; letter-spacing:.18em; opacity:.7; text-transform:uppercase; }
  #score { font:700 34px/1.1 "Courier New",monospace; color:var(--amber); text-shadow:0 0 14px rgba(255,184,74,.7); letter-spacing:.06em; }
  #balls { display:flex; gap:7px; margin-top:6px; }
  #balls i { width:14px; height:14px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,#7d8aa0 60%,#3b4658); box-shadow:0 0 6px rgba(255,255,255,.5); }
  #balls i.gone { opacity:.18; box-shadow:none; }
  #tilt { margin-top:8px; height:6px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden; }
  #tilt b { display:block; height:100%; width:0; background:linear-gradient(90deg,#5fd8ff,#ffb84a,#ff5a5a); }
  .tools { position:absolute; top:max(12px,env(safe-area-inset-top)); right:12px; display:flex; gap:8px; pointer-events:auto; }
  .btn { width:46px; height:46px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:var(--glass); color:#fff; font-size:20px; display:grid; place-items:center; cursor:pointer; backdrop-filter:blur(6px); }
  .btn:active { transform:scale(.94); }
  #banner { position:absolute; left:0; right:0; top:34%; text-align:center; font:900 clamp(40px,10vw,110px)/1 "Trebuchet MS",sans-serif; color:#ff5a5a; text-shadow:0 0 30px rgba(255,60,60,.8); opacity:0; transition:opacity .15s; letter-spacing:.08em; }
  #banner.on { opacity:1; }
  #toast { position:absolute; left:0; right:0; top:22%; text-align:center; font:900 clamp(26px,5vw,52px)/1 "Trebuchet MS",sans-serif; color:#ffe9a8; text-shadow:0 0 24px rgba(255,180,70,.9); opacity:0; transform:scale(.9); transition:opacity .2s, transform .2s; letter-spacing:.06em; }
  #toast.on { opacity:1; transform:scale(1); }
  #mult { position:absolute; right:14px; top:8px; font:900 26px "Trebuchet MS",sans-serif; color:#7affc6; text-shadow:0 0 12px rgba(122,255,198,.8); }
  #hint { position:absolute; left:0; right:0; bottom:max(18px,env(safe-area-inset-bottom)); text-align:center; font-size:15px; opacity:.85; text-shadow:0 2px 8px #000; }
  #charge { position:absolute; right:18px; bottom:130px; width:10px; height:150px; border-radius:5px; background:rgba(255,255,255,.12); overflow:hidden; display:none; }
  #charge b { position:absolute; left:0; right:0; bottom:0; height:0; background:linear-gradient(0deg,#5fd8ff,#ffb84a,#ff5a5a); }
  .pads { position:absolute; inset:auto 0 0 0; height:44%; pointer-events:none; display:none; }
  .pad { position:absolute; bottom:max(16px,env(safe-area-inset-bottom)); width:min(34vw,170px); height:min(34vw,170px); border-radius:50%; pointer-events:auto; display:grid; place-items:center; font-size:15px; letter-spacing:.1em; color:rgba(255,255,255,.75);
    background:radial-gradient(circle at 40% 35%,rgba(255,200,120,.28),rgba(255,120,60,.14)); border:2px solid rgba(255,200,120,.35); }
  .pad.on { background:radial-gradient(circle at 40% 35%,rgba(255,220,150,.6),rgba(255,140,60,.4)); }
  #pl { left:14px; } #pr { right:14px; }
  #pp { left:50%; transform:translateX(-50%); width:min(22vw,110px); height:min(22vw,110px); border-color:rgba(120,210,255,.45); background:radial-gradient(circle at 40% 35%,rgba(120,210,255,.28),rgba(60,120,255,.12)); }
  .nudge { position:absolute; bottom:calc(max(16px,env(safe-area-inset-bottom)) + min(34vw,170px) + 12px); width:64px; height:44px; border-radius:22px; pointer-events:auto; display:grid; place-items:center; background:var(--glass); border:1px solid rgba(255,255,255,.2); font-size:20px; }
  #nl { left:24px; } #nr { right:24px; }
  body.touch .pads { display:block; }
  .overlay { position:fixed; inset:0; display:grid; place-items:center; background:radial-gradient(ellipse at center,rgba(5,8,22,.55),rgba(5,8,22,.92)); z-index:5; }
  .overlay.hidden { display:none; }
  .card { text-align:center; padding:24px 28px; max-width:min(92vw,520px); }
  .card h1 { margin:0; font-size:clamp(40px,9vw,72px); line-height:1; letter-spacing:.04em; background:linear-gradient(135deg,#fff1c4,#ffb347 45%,#5fd8ff); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 18px rgba(255,180,70,.35)); }
  .card h2 { margin:6px 0 22px; font-weight:600; letter-spacing:.3em; font-size:15px; opacity:.8; text-transform:uppercase; }
  .go { font:800 22px "Trebuchet MS",sans-serif; padding:16px 46px; border-radius:40px; border:0; cursor:pointer; color:#1a1000; background:linear-gradient(135deg,#ffe08a,#ffb347); box-shadow:0 0 34px rgba(255,180,70,.5); }
  .go:active { transform:scale(.97); }
  .keys { margin-top:26px; font-size:14px; line-height:1.9; opacity:.85; }
  kbd { padding:2px 8px; border-radius:6px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); font:600 13px monospace; }
  .final { font:700 44px "Courier New",monospace; color:var(--amber); text-shadow:0 0 16px rgba(255,184,74,.7); margin:10px 0 24px; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--ink); z-index:9; font-size:18px; letter-spacing:.2em; }
  #loading.hidden { display:none; }
  .credits { margin-top:18px; font-size:12px; opacity:.55; }
</style>
</head>
<body>
<div id="loading">…</div>
<canvas id="c"></canvas>
<div class="hud">
  <div class="panel"><small id="tScore">Score</small><div id="score">0000000</div><div id="mult"></div><div id="balls"></div><div id="tilt"><b></b></div></div>
  <div class="tools"><div class="btn" id="bPause" title="Pause (P)">❚❚</div><div class="btn" id="bSound" title="Sound (M)">♪</div></div>
  <div id="banner">TILT</div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="charge"><b></b></div>
  <div class="pads"><div class="nudge" id="nl">⇠</div><div class="nudge" id="nr">⇢</div><div class="pad" id="pl">◀</div><div class="pad" id="pp">▲</div><div class="pad" id="pr">▶</div></div>
</div>
<div class="overlay" id="menu"><div class="card">
  <h1>KRINKER<br>PINBALL</h1><h2 id="tWorld"></h2>
  <button class="go" id="play"></button>
  <div class="keys" id="keys"></div>
  <div class="credits">KrinkerLabs · free &amp; open source</div>
</div></div>
<div class="overlay hidden" id="over"><div class="card">
  <h1 id="tOver"></h1><div class="final" id="finalScore"></div>
  <button class="go" id="again"></button>
</div></div>
<div class="overlay hidden" id="pause"><div class="card"><h1 id="tPause"></h1><button class="go" id="resume"></button></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
